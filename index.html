ision:10,diversification:5}},{text:`수익률이 낮아지더라도 원금이 보장되는 정기예금을 그대로 고수한다.`,resultDescription:`원금은 절대적으로 안전하게 보전되었지만, 풍부해진 유동성으로 인해 부동산 가격이 크게 오르면서 자산 격차가 생길 수 있습니다.`,impact:{deposit:.01,saving:.01,house:.05},scoreChange:{decision:5,longTerm:-5}}],lesson:`금리가 인하되면 은행 예적금의 매력이 떨어지고, 자금이 주식, 채권, 부동산 등으로 이동하면서 자산 가격이 상승하기 쉽습니다. 특히 기존에 이자율을 확정해 둔 채권은 가치가 상승하게 됩니다.`,discussionQuestion:`시중에 돈이 너무 많이 풀리면 물가와 화폐 가치에는 어떤 변화가 생길까요?`},{id:`korea_bull`,title:`국내 증시 대세 상승장 (코스피 3,000 돌파)`,description:`국내 반도체 및 신산업의 수출 실적이 사상 최대를 기록하며 코스피 지수가 급등하고 있습니다. 뉴스에서는 온통 주식 이야기뿐입니다.`,affectedAssets:[`korea_etf`,`stock_samsung`,`stock_skhynix`,`stock_hyundai`],choices:[{text:`상승세에 편승하여 국내 주식형 ETF와 국내 우량주에 자산을 집중한다.`,resultDescription:`주식 가격이 크게 올라 즉각적인 대규모 평가 이익을 얻었지만, 포트폴리오의 편중 위험이 높아졌습니다.`,impact:{korea_etf:.15,stock_samsung:.2,stock_skhynix:.28,stock_hyundai:.18},scoreChange:{decision:5,diversification:-15}},{text:`주가가 과열되었다고 판단하고 일부 주식을 팔아 안전한 정기예금과 금 비중을 늘린다 (리밸런싱).`,resultDescription:`상승장에서 주식 수익률을 일부 확정하고 포트폴리오의 안정성을 다져놓았습니다.`,impact:{korea_etf:.05,stock_samsung:.08,stock_skhynix:.1,deposit:.02,gold:.01},scoreChange:{decision:15,diversification:15,longTerm:10}}],lesson:`자산 가격이 급등할 때 비중이 커진 위험자산을 일부 매도하고 원래 목표한 비중대로 안전자산을 다시 매수하는 것을 리밸런싱(자산 배분 재조정)이라고 합니다. 이는 욕심을 통제하고 변동성을 줄이는 훌륭한 전략입니다.`,discussionQuestion:`주가가 계속 오를 때 주식을 더 사지 않고 오히려 파는 결정은 왜 어려울까요?`},{id:`global_crash`,title:`글로벌 증시 급락 및 패닉 셀 현상 발생`,description:`미국의 급격한 인플레이션 우려와 지정학적 분쟁으로 전 세계 주식시장이 하루 만에 5% 넘게 하락하는 등 패닉 상태에 빠졌습니다.`,affectedAssets:[`korea_etf`,`global_etf`,`stock_samsung`,`stock_apple`,`stock_nvidia`,`stock_tesla`,`house`],choices:[{text:`두렵지만 장기 투자의 원칙을 지키며 포트폴리오를 건드리지 않고 인내한다.`,resultDescription:`단기적으로 자산 평가액이 쪼그라들었지만, 투매(패닉 셀)를 피해 손실을 확정 짓지 않았습니다. 글로벌 자산시장 폭락으로 실물 아파트 가격 또한 조정을 받아 하락했습니다.`,impact:{korea_etf:-.12,global_etf:-.15,stock_samsung:-.15,stock_apple:-.12,stock_nvidia:-.28,stock_tesla:-.32,house:-.05},scoreChange:{longTerm:15,decision:10}},{text:`불안감을 견디지 못하고 주식 자산을 모두 매도하여 현금화한다.`,resultDescription:`큰 손실 상태에서 자산을 매도하여 손실이 확정되었습니다. 금융 위기 확산으로 대출 연체 리스크 및 자산 매각 수요가 늘면서 실물 주택 가치도 급락했습니다.`,impact:{korea_etf:-.2,global_etf:-.22,stock_samsung:-.25,stock_nvidia:-.38,stock_tesla:-.42,house:-.08},scoreChange:{longTerm:-20,decision:-10}}],lesson:`시장이 급락할 때 공포에 질려 자산을 매도하는 것을 "패닉 셀(투매)"이라고 합니다. 장기적으로 우상향할 우량 자산이라면 일시적인 폭락장에서 손절하기보다 인내하며 장기적인 관점을 유지하는 것이 성공 확률을 높입니다.`,discussionQuestion:`투자한 자산의 가격이 반토막이 났을 때, 뇌가 느끼는 심리적 압박을 어떻게 이겨낼 수 있을까요?`},{id:`exchange_spike`,title:`환율 급등 (원/달러 환율 1,450원 돌파)`,description:`안전 자산인 달러 수요가 몰리면서 환율이 급격히 상승하고 있습니다. 수입 물가가 비상이며, 미국 주식을 가진 사람들은 환차익을 보고 있습니다.`,affectedAssets:[`global_etf`,`korea_etf`],choices:[{text:`원화 가치가 낮아졌으므로 달러 자산인 글로벌 주식 ETF를 매도해 환차익을 실현한다.`,resultDescription:`환율 상승으로 추가 이익을 더해 매도함으로써 좋은 현금 흐름을 창출했습니다.`,impact:{global_etf:.12,korea_etf:-.03},scoreChange:{decision:10,emergency:5}},{text:`환율은 돌고 도는 것이므로 매도하지 않고 글로벌 우량 주식을 계속 보유한다.`,resultDescription:`자산 비중을 유지하며 지속적인 장기 성장을 추구합니다.`,impact:{global_etf:.05,korea_etf:-.02},scoreChange:{longTerm:10,decision:5}}],lesson:`해외 자산에 투자하면 해당 국가 통화의 가치(환율)에 영향을 받습니다. 원화 대비 달러 환율이 상승하면 해외 주식의 원화 환산 가치가 상승하여 추가적인 환차익을 얻을 수 있지만, 반대의 경우에는 환차손을 입을 수 있습니다.`,discussionQuestion:`환율이 오르면 우리나라의 수출 기업과 수입 기업 중 어느 쪽이 유리할까요?`},{id:`inflation_shock`,title:`고물가 습격 (스태그플레이션 우려)`,description:`원자재 가격과 유가가 급등하면서 외식비, 교통비 등 생활물가가 폭등하고 있습니다. 내가 받는 월급의 구매 가치가 떨어지고 있습니다.`,affectedAssets:[`cash`,`deposit`,`saving`,`gold`,`house`],choices:[{text:`물가 방어력이 높은 대표적 원자자산인 금에 추가 배분(200만 원 매수)한다.`,resultDescription:`현금 200만 원을 인출하여 대표적 실물 안전자산인 금 200만 원을 새로 매수·배분했습니다! 금 가격 상승 효과가 더해져 인플레이션 화폐 가치 하락을 효과적으로 방어합니다.`,cashChange:-200,flatAssetChange:{gold:200},impact:{gold:.08,house:.04},scoreChange:{decision:15,diversification:10}},{text:`생활비가 올라 불안하니 일단 투자금을 줄이고 입출금 통장에 현금을 쟁여둔다.`,resultDescription:`심리적 안정은 얻었으나, 물가 상승률보다 현금 이율이 낮아 실질적인 구매력 손실을 입게 됩니다. 실물 자산인 부동산의 명목 가격은 오르지만 화폐 대비 자산 비중이 낮아 손해를 입습니다.`,cashChange:50,impact:{cash:-.04,deposit:-.02,gold:.02,house:.03},scoreChange:{decision:-5,longTerm:-5}}],lesson:`인플레이션(물가     @keyframes characterFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-8px) scale(1.015);
      }
    }

    @keyframes characterBreath {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.01);
      }
    }

    @keyframes characterTilt {
      0%, 100% {
        transform: rotate(-0.8deg);
      }
      50% {
        transform: rotate(0.8deg);
      }
    }

    @keyframes characterShadow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.22;
      }
      50% {
        transform: scale(0.88);
        opacity: 0.14;
      }
    }

    @keyframes softPulseRing {
      0% {
        transform: scale(0.92);
        opacity: 0.55;
      }
      100% {
        transform: scale(1.25);
        opacity: 0;
      }
    }

    @keyframes sparkleFade {
      0%, 100% {
        opacity: 0.2;
        transform: translateY(0) scale(0.9);
      }
      50% {
        opacity: 0.9;
        transform: translateY(-4px) scale(1.1);
      }
    }

    @keyframes bubbleFadeUp {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typingDot {
      0%, 80%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* 식은땀 방울 💧 흘러내리기 */
    @keyframes satieSweat {
      0% { transform: translateY(0) scale(0); opacity: 0; }
      15% { transform: translateY(0) scale(1.1); opacity: 1; }
      80% { transform: translateY(7px) scale(0.95); opacity: 0.8; }
      100% { transform: translateY(10px) scale(0.8); opacity: 0; }
    }

    /* 클래스에 애니메이션 속성 매핑 - 마우스 호버 시에만 동작 */
    .character-motion {
      transform-origin: bottom center;
      transition: transform 0.3s ease-in-out;
    }
    .group:hover .character-motion {
      animation: characterFloat 3.8s ease-in-out infinite, characterBreath 3.8s ease-in-out infinite;
    }
    
    .character-shadow {
      transform-origin: center;
      transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
    }
    .group:hover .character-shadow {
      animation: characterShadow 3.8s ease-in-out infinite;
    }

    .character-tilt {
      display: inline-block;
      transform-origin: bottom center;
      transition: transform 0.3s ease-in-out;
    }
    .group:hover .character-tilt {
      animation: characterTilt 3.5s ease-in-out infinite;
    }

    .character-pulse-ring {
      transform-origin: center;
      opacity: 0;
    }
    .group:hover .character-pulse-ring {
      animation: softPulseRing 1.8s ease-out infinite;
    }

    .character-sparkle {
      opacity: 0.2;
    }
    .group:hover .character-sparkle {
      animation: sparkleFade 1.6s ease-in-out infinite;
    }
    .character-sparkle.delay-200 {
      animation-delay: 200ms;
    }
    .character-sparkle.delay-500 {
      animation-delay: 500ms;
    }

    .character-bubble {
      animation: bubbleFadeUp 0.45s ease-out forwards;
    }

    .character-dot {
      animation: typingDot 1.4s infinite ease-in-out;
    }

    .animate-satie-sweat {
      opacity: 0;
    }
    .group:hover .animate-satie-sweat {
      animation: satieSweat 2.2s infinite ease-in-out;
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.35; transform: scale(0.95); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    .group:hover .animate-pulse-slow {
      animation: pulse-slow 6s ease-in-out infinite;
    }

    /* 미디어 쿼리 기반 모션 감소 접근성 지원 */
    @media (prefers-reduced-motion: reduce) {
      .character-motion,
      .character-shadow,
      .character-sparkle,
      .character-bubble,
      .character-tilt,
      .character-pulse-ring,
      .character-dot,
      .animate-satie-sweat {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }
