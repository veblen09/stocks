코스피가 82.8%, 코스닥이 240% 폭등했습니다. 현대증권 바이코리아 펀드 돌풍이 불었습니다."},{"year":2000,"titleKo":"닷컴 버블 붕괴와 IT 암흑기","descriptionKo":"수익성 없는 인터넷 기업들의 주가가 무너지며 나스닥이 -39%, 코스피가 -50.9% 폭락하는 역사상 최악의 버블 붕괴를 겪었습니다."},{"year":2001,"titleKo":"9·11 테러와 초저금리 시대 개막","descriptionKo":"9월 11일 뉴욕 세계무역센터 테러로 세계 증시가 충격을 받았으나, 미 연준의 파격적 금리 인하(1.75%)와 유동성으로 연말 증시는 V자 반등했습니다."},{"year":2002,"titleKo":"한일 월드컵 4강과 카드채 사태 조짐","descriptionKo":"2002 월드컵 열기 속에 내수 소비가 부양되었으나, 무분별한 신용카드 발급으로 연말 카드채 부실 위기가 고조되었습니다."},{"year":2003,"titleKo":"이라크 전쟁과 카드 대란 수습","descriptionKo":"미국의 이라크 침공과 SK글로벌 분식회계, 카드사 부도 위기가 닥쳤으나, 정부의 공적자금 투입과 중국 특수 기대감으로 하반기 반등했습니다."},{"year":2004,"titleKo":"차이나 쇼크와 구글(Google)의 상장","descriptionKo":"중국 원자바오 총리의 긴축 발언으로 '차이나 쇼크'가 발생했으나, 8월 구글이 나스닥에 상장하며 웹 2.0 시대를 열었습니다."},{"year":2005,"titleKo":"적립식 펀드 돌풍과 코스피 신고가","descriptionKo":"적립식 펀드 붐이 대한민국을 강타하며 매월 수조 원의 개인 자금이 유입되어 코스피가 53.9% 폭등, 16년 만에 사상 최고가를 경신했습니다."},{"year":2006,"titleKo":"미국 주택 버블 정점과 글로벌 경기 확장","descriptionKo":"미국 부동산 시장이 정점에 달하고 유가가 70달러를 돌파했습니다. 한국 증시는 원화 강세(930원대) 속에서도 견조한 실적으로 1,400p를 유지했습니다."},{"year":2007,"titleKo":"아이폰 출시와 인사이트 펀드 광풍","descriptionKo":"스티브 잡스가 1월 최초의 아이폰을 발표했습니다. 미래에셋 인사이트 펀드 등 해외 브릭스(BRICs) 투자 광풍 속에 코스피는 사상 처음 2,000p를 돌파했습니다."},{"year":2008,"titleKo":"리먼 브라더스 파산과 글로벌 금융위기","descriptionKo":"서브프라임 모기지 사태로 9월 158년 전통의 리먼 브라더스가 파산하며 1929년 대공황 이후 최악의 글로벌 금융위기가 닥쳤습니다. 코스피 -40.7%, S&P500 -38.5% 폭락."},{"year":2009,"titleKo":"양적완화(QE)와 차·화·정 랠리","descriptionKo":"벤 버냉키 연준 의장의 전례 없는 '헬리콥터 머니' 양적완화로 유동성이 폭발했습니다. 한국은 자동차·화학·정유(차화정)의 경쟁력으로 49.6% V자 반등했습니다."},{"year":2010,"titleKo":"스마트폰 혁명과 자문형 랩 붐","descriptionKo":"갤럭시 S와 아이폰 4가 보급되며 모바일 스마트폰 혁명이 본격화되었습니다. 코스피 지수는 연말 2,051p로 사상 최고 종가를 기록했습니다."},{"year":2011,"titleKo":"미국 신용등급 강등과 유럽 재정위기","descriptionKo":"S&P가 사상 최초로 미국 국가신용등급을 AAA에서 AA+로 강등하고, 그리스·이탈리아 등 남유럽 재정위기가 번지며 8월 글로벌 증시가 폭락했습니다."},{"year":2012,"titleKo":"드라기 총재의 유로존 수호와 아베노믹스","descriptionKo":"마리오 드라기 ECB 총재의 'Whatever it takes' 선언으로 유럽 위기가 진정되었고, 일본은 아베노믹스 무제한 돈풀기를 시작했습니다."},{"year":2013,"titleKo":"버냉키 텐트럼(테이퍼 발작)과 미국 호황","descriptionKo":"연준의 자산매입 축소(테이퍼링) 시사로 신흥국 통화가치가 급락하는 긴축 발작이 발생했으나, 미국 증시는 기업 실적 호조로 S&P 500이 29.6% 급등했습니다."},{"year":2014,"titleKo":"유가 대폭락과 박스피의 늪","descriptionKo":"미국 셰일가스 혁명과 사우디의 증산 치킨게임으로 국제유가가 배럴당 100달러에서 50달러로 반토막 났습니다. 한국 증시는 1,900선 박스권에 갇혔습니다."},{"year":2015,"titleKo":"중국 증시 버블 붕괴와 위안화 기습 절하","descriptionKo":"상하이 종합지수가 5,000p에서 반토막 나고 중국 인민은행의 기습 위안화 절하로 글로벌 금융시장이 요동쳤습니다. 미 연준은 9년 만에 첫 금리 인상을 단행했습니다."},{"year":2016,"titleKo":"브렉시트 충격과 트럼프 대통령 당선","descriptionKo":"영국의 EU 탈퇴(브렉시트) 가결과 도널드 트럼프의 미국 대통령 당선이라는 두 번의 정치적 이변이 일어났으나, 친기업 감세 기대감으로 증시는 상승 마감했습니다."},{"year":2017,"titleKo":"반도체 슈퍼사이클과 코스피 2,500 돌파","descriptionKo":"클라우드 데이터센터 증설로 메모리 반도체 슈퍼호황이 오며 삼성전자와 SK하이닉스가 사상 최대 실적을 경신, 코스피가 21.8% 상승해 2,500p를 돌파했습니다."},{"year":2018,"titleKo":"미·중 무역전쟁과 파월 연준의 금리인상","descriptionKo":"트럼프 행정부의 대중 관세 폭탄과 파월 연준 의장의 4차례 금리 인상으로 글로벌 공급망이 흔들리며 전 세계 증시가 -10~-20% 조정을 받았습니다."},{"year":2019,"titleKo":"연준의 금리인하 피벗과 빅테크 질주","descriptionKo":"경기 둔화 우려에 연준이 '보험성 금리인하'로 돌아서며 유동성이 재유입되었습니다. 애플(+86%), 마이크로소프트(+55%) 등 빅테크가 신고가를 썼습니다."},{"year":2020,"titleKo":"코로나19 팬데믹 쇼크와 동학개미운동","descriptionKo":"3월 전 세계 셧다운으로 증시가 -35% 서킷브레이커를 맞았으나, 사상 최대 무제한 유동성 공급과 '동학개미·서학개미' 개인투자자 열풍으로 코스피가 2,873p 사상 최고치를 찍었습니다."},{"year":2021,"titleKo":"코스피 3,000 돌파와 인플레이션의 부활","descriptionKo":"코스피가 사상 최초 3,300p(장중)를 돌파했습니다. 그러나 공급망 병목과 유동성 과잉으로 40년 만의 최악 인플레이션 압력이 가중되었습니다."},{"year":2022,"titleKo":"러시아-우크라이나 전쟁과 4연속 자이언트 스텝","descriptionKo":"러시아의 우크라이나 침공으로 에너지·곡물 가격이 폭등하자 미 연준이 4연속 0.75%p 금리 인상(자이언트 스텝)을 단행, 주식과 채권이 동반 폭락했습니다."},{"year":2023,"titleKo":"생성형 AI 혁명(ChatGPT)과 매그니피센트 7","descriptionKo":"OpenAI의 ChatGPT가 촉발한 생성형 AI 붐으로 엔비디아(+239%)를 필두로 한 M7 빅테크가 폭등하며 S&P 500이 24.2% 반등했습니다."},{"year":2024,"titleKo":"금리인하 사이클 진입과 AI 버블 논쟁","descriptionKo":"미 연준이 9월 0.50%p 빅컷을 단행하며 글로벌 완화 기조로 복귀했습니다. AI 반도체 랠리가 이어진 반면, 원/달러 환율은 1,470원대까지 급등했습니다."},{"year":2025,"titleKo":"45년 대단원의 해: AI 생태계 성숙과 밸류업","descriptionKo":"AI의 실질적 산업 적용과 대한민국 밸류업 정책, 글로벌 통화정책 안정이 맞물리며 1980년부터 이어진 45년간의 한·미 주식시장 대장정이 새로운 이정표를 세웠습니다."
